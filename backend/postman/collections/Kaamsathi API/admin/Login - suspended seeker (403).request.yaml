$kind: http-request
description: |-
  Suspended account cannot log in.
  
  Expected: 403 {"code":"ACCOUNT_SUSPENDED",...}
url: '{{baseUrl}}/api/auth/login'
method: POST
headers:
  - key: Content-Type
    value: application/json
auth:
  type: noauth
body:
  type: json
  content: |-
    {
      "email": "{{targetEmail}}",
      "password": "secret123"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('403 Forbidden', () => pm.response.to.have.status(403));
      pm.test('code ACCOUNT_SUSPENDED', () => pm.expect(pm.response.json().code).to.eql('ACCOUNT_SUSPENDED'));
    language: text/javascript
order: 12100
