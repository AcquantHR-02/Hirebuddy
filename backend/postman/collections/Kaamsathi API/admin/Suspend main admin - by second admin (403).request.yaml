$kind: http-request
description: |-
  Only the main admin may act on admins.
  
  Expected: 403 {"code":"SUPER_ADMIN_ONLY",...}
url: '{{baseUrl}}/api/admin/users/{{mainAdminId}}/suspend'
method: POST
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{newAdminAccessToken}}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('403 Forbidden', () => pm.response.to.have.status(403));
      pm.test('code SUPER_ADMIN_ONLY', () => pm.expect(pm.response.json().code).to.eql('SUPER_ADMIN_ONLY'));
    language: text/javascript
order: 12300
