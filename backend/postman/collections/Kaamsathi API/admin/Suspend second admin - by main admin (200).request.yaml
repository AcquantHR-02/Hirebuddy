$kind: http-request
description: |-
  Main admin may deactivate another admin.
  
  Expected: 200 {"role":"ADMIN","status":"SUSPENDED",...}
url: '{{baseUrl}}/api/admin/users/{{newAdminId}}/suspend'
method: POST
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{adminAccessToken}}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      pm.test('status is SUSPENDED', () => pm.expect(pm.response.json().status).to.eql('SUSPENDED'));
    language: text/javascript
order: 12700
