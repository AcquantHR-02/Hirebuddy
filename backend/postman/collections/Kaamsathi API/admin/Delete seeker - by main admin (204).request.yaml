$kind: http-request
description: |-
  Hard delete (tokens, saved jobs go with it).
  
  Expected: 204
url: '{{baseUrl}}/api/admin/users/{{targetId}}'
method: DELETE
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{adminAccessToken}}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('204 No Content', () => pm.response.to.have.status(204));
    language: text/javascript
order: 13100
