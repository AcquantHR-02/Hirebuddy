$kind: http-request
description: |-
  Any admin may suspend a non-admin.
  
  Expected: 200 {"status":"SUSPENDED",...}
url: '{{baseUrl}}/api/admin/users/{{targetId}}/suspend'
method: POST
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{newAdminAccessToken}}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      pm.test('status is SUSPENDED', () => pm.expect(pm.response.json().status).to.eql('SUSPENDED'));
    language: text/javascript
order: 12000
