$kind: http-request
description: |-
  Lift the block.
  
  Expected: 200 {"status":"ACTIVE",...}
url: '{{baseUrl}}/api/admin/users/{{targetId}}/unsuspend'
method: POST
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{newAdminAccessToken}}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      pm.test('status is ACTIVE', () => pm.expect(pm.response.json().status).to.eql('ACTIVE'));
    language: text/javascript
order: 12200
