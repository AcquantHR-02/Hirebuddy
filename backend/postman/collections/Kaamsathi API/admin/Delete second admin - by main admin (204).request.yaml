$kind: http-request
description: |-
  Main admin removes another admin.
  
  Expected: 204
url: '{{baseUrl}}/api/admin/users/{{newAdminId}}'
method: DELETE
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{adminAccessToken}}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('204 No Content', () => pm.response.to.have.status(204));
    language: text/javascript
order: 13300
