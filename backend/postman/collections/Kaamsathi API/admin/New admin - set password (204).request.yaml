$kind: http-request
description: |-
  The new admin opens the emailed link and sets a password (same API as forgot/reset password). Account becomes ACTIVE.
  
  Expected: 204 No Content
url: '{{baseUrl}}/api/auth/reset-password'
method: POST
headers:
  - key: Content-Type
    value: application/json
auth:
  type: noauth
body:
  type: json
  content: |-
    {
      "token": "{{newAdminSetupToken}}",
      "newPassword": "admin12345"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('204 No Content', () => pm.response.to.have.status(204));
    language: text/javascript
order: 7000
