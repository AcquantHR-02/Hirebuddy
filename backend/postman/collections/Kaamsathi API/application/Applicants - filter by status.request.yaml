$kind: http-request
description: |-
  ?status=SHORTLISTED → nobody is shortlisted yet.

  Expected: 200 {"items":[],"totalItems":0,...}
url: '{{baseUrl}}/api/jobs/{{appJobId}}/applications?status=SHORTLISTED'
method: GET
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{appOwnerToken}}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      pm.test('empty list', () => pm.expect(pm.response.json().totalItems).to.eql(0));
    language: text/javascript
order: 3920
