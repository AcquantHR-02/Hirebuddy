$kind: http-request
description: |-
  Seekers use /api/applications/{id}, not the company endpoint.

  Expected: 403 {"code":"ACCESS_DENIED",...}
url: '{{baseUrl}}/api/company/applications/{{appApplicationId}}'
method: GET
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{appSeekerToken}}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('403 Forbidden', () => pm.response.to.have.status(403));
      pm.test('ACCESS_DENIED', () => pm.expect(pm.response.json().code).to.eql('ACCESS_DENIED'));
    language: text/javascript
order: 4250
