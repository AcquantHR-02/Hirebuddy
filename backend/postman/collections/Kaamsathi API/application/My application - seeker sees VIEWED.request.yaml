$kind: http-request
description: |-
  The seeker's tracker now shows "Viewed".

  Expected: 200 {"application":{"status":"VIEWED","viewedAt":"..."},"timeline":[APPLIED, VIEWED]}
url: '{{baseUrl}}/api/applications/{{appApplicationId}}'
method: GET
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{appSeekerToken}}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      const b = pm.response.json();
      pm.test('status VIEWED', () => { pm.expect(b.application.status).to.eql('VIEWED'); pm.expect(b.application.viewedAt).to.eql(pm.collectionVariables.get('appViewedAt')); });
      pm.test('timeline APPLIED, VIEWED', () => pm.expect(b.timeline.map(t => t.status)).to.eql(['APPLIED', 'VIEWED']));
    language: text/javascript
order: 4230
