$kind: http-request
description: |-
  Closed job can not be applied to.
  
  Expected: 404 {"code":"JOB_NOT_FOUND",...}
url: '{{baseUrl}}/api/jobs/{{appClosedJobId}}/apply'
method: POST
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{appSeekerToken}}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('404 Not Found', () => pm.response.to.have.status(404));
      pm.test('JOB_NOT_FOUND', () => pm.expect(pm.response.json().code).to.eql('JOB_NOT_FOUND'));
    language: text/javascript
order: 3600
