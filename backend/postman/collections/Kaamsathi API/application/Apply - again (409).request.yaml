$kind: http-request
description: |-
  One application per job.
  
  Expected: 409 {"code":"ALREADY_APPLIED",...}
url: '{{baseUrl}}/api/jobs/{{appJobId}}/apply'
method: POST
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{appSeekerToken}}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('409 Conflict', () => pm.response.to.have.status(409));
      pm.test('ALREADY_APPLIED', () => pm.expect(pm.response.json().code).to.eql('ALREADY_APPLIED'));
    language: text/javascript
order: 3900
