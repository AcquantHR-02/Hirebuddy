$kind: http-request
description: |-
  Setup: login. Saves {{appSeekerToken}}.
  
  Expected: 200
url: '{{baseUrl}}/api/auth/login'
method: POST
headers:
  - key: Content-Type
    value: application/json
auth:
  type: noauth
body:
  type: json
  content: |-
    {
      "email": "{{appSeekerEmail}}",
      "password": "secret123"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      pm.collectionVariables.set('appSeekerToken', pm.response.json().accessToken);
    language: text/javascript
order: 2500
