$kind: http-request
description: |-
  Not mine / unknown → same 404.
  
  Expected: 404 {"code":"APPLICATION_NOT_FOUND",...}
url: '{{baseUrl}}/api/applications/00000000-0000-0000-0000-000000000000/withdraw'
method: POST
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{appSeekerToken}}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('404 Not Found', () => pm.response.to.have.status(404));
      pm.test('APPLICATION_NOT_FOUND', () => pm.expect(pm.response.json().code).to.eql('APPLICATION_NOT_FOUND'));
    language: text/javascript
order: 4300
