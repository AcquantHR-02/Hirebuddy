$kind: http-request
description: |-
  Setup: admin verifies the company (needed to post jobs).
  
  Expected: 200 VERIFIED
url: '{{baseUrl}}/api/companies/{{appCompanyId}}/verify'
method: POST
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{adminAccessToken}}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
    language: text/javascript
order: 1900
