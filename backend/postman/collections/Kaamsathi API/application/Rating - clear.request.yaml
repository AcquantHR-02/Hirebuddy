$kind: http-request
description: |-
  null clears the rating.
  
  Expected: 200 {"rating":null,...}
url: '{{baseUrl}}/api/company/applications/{{appApplicationId}}/rating'
method: PUT
headers:
  - key: Content-Type
    value: application/json
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{appOwnerToken}}'
body:
  type: json
  content: |-
    {"rating": null}
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      pm.test('rating cleared', () => pm.expect(pm.response.json().rating).to.eql(null));
    language: text/javascript
order: 4980
