$kind: http-request
description: |-
  A seeker can't hire themselves.

  Expected: 403 {"code":"ACCESS_DENIED",...}
url: '{{baseUrl}}/api/company/applications/{{appApplicationId}}/status'
method: POST
headers:
  - key: Content-Type
    value: application/json
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{appSeekerToken}}'
body:
  type: json
  content: |-
    {"status": "HIRED"}
scripts:
  - type: afterResponse
    code: |-
      pm.test('403 Forbidden', () => pm.response.to.have.status(403));
      pm.test('ACCESS_DENIED', () => pm.expect(pm.response.json().code).to.eql('ACCESS_DENIED'));
    language: text/javascript
order: 4290
