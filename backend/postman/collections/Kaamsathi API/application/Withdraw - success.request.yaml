$kind: http-request
description: |-
  Take it back.
  
  Expected: 200 {"status":"WITHDRAWN",...}
url: '{{baseUrl}}/api/applications/{{appApplicationId}}/withdraw'
method: POST
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{appSeekerToken}}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      pm.test('WITHDRAWN', () => pm.expect(pm.response.json().status).to.eql('WITHDRAWN'));
    language: text/javascript
order: 4400
