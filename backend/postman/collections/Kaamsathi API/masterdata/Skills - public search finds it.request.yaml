$kind: http-request
description: |-
  Public dropdown, NO token: search by part of the name.

  Expected: 200 [{"id":"{{skillId}}","name":"{{skillName}}","active":true}]
url: '{{baseUrl}}/api/masterdata/skills?q={{skillName}}'
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK without login', () => pm.response.to.have.status(200));
      pm.test('our skill is found', () => {
          pm.expect(pm.response.json().map(s => s.id)).to.include(pm.collectionVariables.get('skillId'));
      });
    language: text/javascript
order: 7000
