$kind: http-request
description: |-
  /categories/all is admin-only (the public rule opens only ONE path part).

  Expected: 401 {"code":"INVALID_TOKEN",...}
url: '{{baseUrl}}/api/masterdata/categories/all'
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('401 Unauthorized', () => pm.response.to.have.status(401));
      pm.test('code INVALID_TOKEN', () => pm.expect(pm.response.json().code).to.eql('INVALID_TOKEN'));
    language: text/javascript
order: 24000
