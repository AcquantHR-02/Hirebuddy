$kind: http-request
description: |-
  Public dropdown, NO token, finds the renamed category.

  Expected: 200 [{"id":"{{categoryId}}","name":"{{categoryName}}","active":true}]
url: '{{baseUrl}}/api/masterdata/categories?q={{categoryName}}'
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK without login', () => pm.response.to.have.status(200));
      pm.test('our category is found', () => {
          pm.expect(pm.response.json().map(c => c.id)).to.include(pm.collectionVariables.get('categoryId'));
      });
    language: text/javascript
order: 23000
