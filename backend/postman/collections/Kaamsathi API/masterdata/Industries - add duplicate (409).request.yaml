$kind: http-request
description: |-
  Same name again → duplicate.

  Expected: 409 {"code":"MASTERDATA_NAME_EXISTS",...}
url: '{{baseUrl}}/api/masterdata/industries'
method: POST
headers:
  - key: Content-Type
    value: application/json
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{adminAccessToken}}'
body:
  type: json
  content: |-
    {
      "name": "{{industryName}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('409 Conflict', () => pm.response.to.have.status(409));
      pm.test('code MASTERDATA_NAME_EXISTS', () => pm.expect(pm.response.json().code).to.eql('MASTERDATA_NAME_EXISTS'));
    language: text/javascript
order: 16000
