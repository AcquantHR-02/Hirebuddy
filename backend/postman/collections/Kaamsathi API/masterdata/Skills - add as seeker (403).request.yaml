$kind: http-request
description: |-
  Role proof: {{accessToken}} is the SEEKER token from the auth folder → only ADMIN may add.

  Expected: 403 {"code":"ACCESS_DENIED",...}
url: '{{baseUrl}}/api/masterdata/skills'
method: POST
headers:
  - key: Content-Type
    value: application/json
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
body:
  type: json
  content: |-
    {
      "name": "SeekerSkill"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('403 Forbidden', () => pm.response.to.have.status(403));
      pm.test('code ACCESS_DENIED', () => pm.expect(pm.response.json().code).to.eql('ACCESS_DENIED'));
    language: text/javascript
order: 6000
