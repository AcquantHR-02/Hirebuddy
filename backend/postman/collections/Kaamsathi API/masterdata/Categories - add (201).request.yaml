$kind: http-request
description: |-
  Admin adds a job category (unique name each run). Saves {{categoryId}} / {{categoryName}}.

  Expected: 201 {"id":"<uuid>","name":"PmCategory...","active":true}
url: '{{baseUrl}}/api/masterdata/categories'
method: POST
headers:
  - key: Content-Type
    value: application/json
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{adminAccessToken}}'
body:
  type: json
  content: |-
    {
      "name": "{{categoryName}}"
    }
scripts:
  - type: beforeRequest
    code: |-
      pm.collectionVariables.set('categoryName', 'PmCategory' + Date.now());
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('201 Created', () => pm.response.to.have.status(201));
      const body = pm.response.json();
      pm.test('name + active', () => {
          pm.expect(body.name).to.eql(pm.collectionVariables.get('categoryName'));
          pm.expect(body.active).to.eql(true);
      });
      pm.collectionVariables.set('categoryId', body.id);
    language: text/javascript
order: 20000
