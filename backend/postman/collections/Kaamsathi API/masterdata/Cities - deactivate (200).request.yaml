$kind: http-request
description: |-
  Admin hides the Maharashtra city ({{cityId}}).

  Expected: 200 {"id":"{{cityId}}","active":false,...}
url: '{{baseUrl}}/api/masterdata/cities/{{cityId}}/deactivate'
method: POST
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{adminAccessToken}}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      pm.test('hidden', () => pm.expect(pm.response.json().active).to.eql(false));
    language: text/javascript
order: 30000
