$kind: http-request
description: |-
  Admin makes the skill visible again.

  Expected: 200 {"id":"{{skillId}}","active":true,...}
url: '{{baseUrl}}/api/masterdata/skills/{{skillId}}/activate'
method: POST
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{adminAccessToken}}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      pm.test('visible again', () => pm.expect(pm.response.json().active).to.eql(true));
    language: text/javascript
order: 13000
