$kind: http-request
description: |-
  Admin hides the industry.

  Expected: 200 {"id":"{{industryId}}","active":false,...}
url: '{{baseUrl}}/api/masterdata/industries/{{industryId}}/deactivate'
method: POST
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{adminAccessToken}}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      pm.test('hidden', () => pm.expect(pm.response.json().active).to.eql(false));
    language: text/javascript
order: 18000
