$kind: http-request
description: |-
  No photo any more.
  
  Expected: 404 {"code":"FILE_NOT_FOUND","message":"This user has no photo"}
url: '{{baseUrl}}/api/auth/users/{{photoUserId}}/photo'
method: GET
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{adminAccessToken}}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('404 Not Found', () => pm.response.to.have.status(404));
      pm.test('FILE_NOT_FOUND', () => pm.expect(pm.response.json().code).to.eql('FILE_NOT_FOUND'));
    language: text/javascript
order: 3700
