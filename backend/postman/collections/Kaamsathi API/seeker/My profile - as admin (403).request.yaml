$kind: http-request
description: |-
  Only seekers have a profile.
  
  Expected: 403 {"code":"ACCESS_DENIED",...}
url: '{{baseUrl}}/api/seekers/me'
method: GET
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{adminAccessToken}}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('403 Forbidden', () => pm.response.to.have.status(403));
      pm.test('ACCESS_DENIED', () => pm.expect(pm.response.json().code).to.eql('ACCESS_DENIED'));
    language: text/javascript
order: 2100
