$kind: http-request
description: |-
  PUT is a FULL replace: send 1 education and no experience / skills / city → old rows are gone.
  
  Expected: 200 {"education":[{"degree":"M.Tech",...}],"experience":[],"skills":[],"city":null,...}
url: '{{baseUrl}}/api/seekers/me'
method: PUT
headers:
  - key: Content-Type
    value: application/json
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{seekerAccessToken2}}'
body:
  type: json
  content: |-
    {
      "fullName": "Ravi Kumar",
      "experienceYears": 4,
      "skillIds": [],
      "preferredCityIds": [],
      "education": [
        {
          "degree": "M.Tech",
          "institute": "IIT Bombay",
          "startYear": 2021,
          "endYear": null
        }
      ],
      "experience": []
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      pm.test('lists replaced', () => { const b = pm.response.json(); pm.expect(b.education.map(e => e.degree)).to.eql(['M.Tech']); pm.expect(b.experience).to.eql([]); pm.expect(b.skills).to.eql([]); pm.expect(b.city).to.eql(null); pm.expect(b.experienceYears).to.eql(4); });
    language: text/javascript
order: 2700
