$kind: http-request
description: |-
  Remove my photo.
  
  Expected: 204, no body
url: '{{baseUrl}}/api/auth/me/photo'
method: DELETE
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{seekerAccessToken2}}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('204 No Content', () => pm.response.to.have.status(204));
    language: text/javascript
order: 3600
