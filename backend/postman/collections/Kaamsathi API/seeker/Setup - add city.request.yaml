$kind: http-request
description: |-
  Setup: a city for the profile. Saves {{seekerCityId}}.
  
  Expected: 201
url: '{{baseUrl}}/api/masterdata/cities'
method: POST
headers:
  - key: Content-Type
    value: application/json
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{adminAccessToken}}'
body:
  type: json
  content: |-
    {
      "name": "SeekerCity{{$timestamp}}",
      "state": "Maharashtra"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('201 Created', () => pm.response.to.have.status(201));
      pm.collectionVariables.set('seekerCityId', pm.response.json().id);
    language: text/javascript
order: 1100
