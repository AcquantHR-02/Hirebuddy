$kind: http-request
description: |-
  Seeker uploads a real PNG. Saves photoUserId + photoFileId.
  
  Expected: 200 UserResponse {"id":"...","photoFileId":"...",...}
url: '{{baseUrl}}/api/auth/me/photo'
method: PUT
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{seekerAccessToken2}}'
body:
  type: formdata
  content:
    - key: file
      type: file
      src: 'postman/files/photo.png'
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      pm.test('photo linked', () => { const b = pm.response.json(); pm.expect(b.photoFileId).to.be.a('string'); pm.collectionVariables.set('photoUserId', b.id); pm.collectionVariables.set('photoFileId', b.photoFileId); });
    language: text/javascript
order: 3300
