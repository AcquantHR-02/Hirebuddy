$kind: http-request
description: |-
  Every photo endpoint needs a login.
  
  Expected: 401 {"code":"INVALID_TOKEN",...}
url: '{{baseUrl}}/api/auth/me/photo'
method: PUT
auth:
  type: noauth
body:
  type: formdata
  content:
    - key: file
      type: file
      src: 'postman/files/photo.png'
scripts:
  - type: afterResponse
    code: |-
      pm.test('401 Unauthorized', () => pm.response.to.have.status(401));
      pm.test('INVALID_TOKEN', () => pm.expect(pm.response.json().code).to.eql('INVALID_TOKEN'));
    language: text/javascript
order: 3000
