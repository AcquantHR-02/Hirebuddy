$kind: http-request
description: |-
  Token is valid, but the password check fails → account is NOT deleted.

  Expected: 401
  {"code":"INVALID_CREDENTIALS","message":"Email or password is wrong",...}
url: '{{baseUrl}}/api/auth/me'
method: DELETE
headers:
  - key: Content-Type
    value: application/json
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
body:
  type: json
  content: |-
    {
      "password": "wrongPassword1"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('401 Unauthorized', () => pm.response.to.have.status(401));
      pm.test('code INVALID_CREDENTIALS', () => pm.expect(pm.response.json().code).to.eql('INVALID_CREDENTIALS'));
    language: text/javascript
order: 34000
