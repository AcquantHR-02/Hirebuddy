$kind: http-request
description: |-
  Logging out twice (or with an unknown token) never fails and reveals nothing.

  Expected: 204 No Content
url: '{{baseUrl}}/api/auth/logout'
method: POST
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "refreshToken": "{{refreshToken}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('204 No Content', () => pm.response.to.have.status(204));
    language: text/javascript
order: 18000
