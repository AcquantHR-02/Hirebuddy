$kind: http-request
description: |-
  New password too short (min 8). Checked before the token is even looked at.

  Expected: 400
  {"code":"VALIDATION_FAILED","message":"newPassword: newPassword must be 8 to 72 characters",...}
url: '{{baseUrl}}/api/auth/reset-password'
method: POST
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "token": "anything",
      "newPassword": "123"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('400 Bad Request', () => pm.response.to.have.status(400));
      pm.test('code VALIDATION_FAILED', () => pm.expect(pm.response.json().code).to.eql('VALIDATION_FAILED'));
    language: text/javascript
order: 26000
