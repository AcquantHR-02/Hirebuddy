$kind: http-request
description: |-
  Right email, wrong password. Same message as an unknown email (no user enumeration).
  Counts as 1 failed login (5 in a row → 429 ACCOUNT_LOCKED for 15 min).

  Expected: 401
  {"code":"INVALID_CREDENTIALS","message":"Email or password is wrong",...}
url: '{{baseUrl}}/api/auth/login'
method: POST
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "{{seekerEmail}}",
      "password": "wrong-password"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('401 Unauthorized', () => pm.response.to.have.status(401));
      pm.test('code INVALID_CREDENTIALS', () => pm.expect(pm.response.json().code).to.eql('INVALID_CREDENTIALS'));
    language: text/javascript
order: 8000
