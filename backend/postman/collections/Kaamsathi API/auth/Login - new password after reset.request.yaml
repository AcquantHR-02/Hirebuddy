$kind: http-request
description: |-
  The new password from "Reset password - success" works. Saves fresh tokens for the next requests.

  Expected: 200
  {"accessToken":"eyJ...","refreshToken":"...","tokenType":"Bearer","expiresIn":900}
url: '{{baseUrl}}/api/auth/login'
method: POST
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "{{seekerEmail}}",
      "password": "newSecret123"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test('access token present', () => pm.expect(body.accessToken).to.be.a('string').and.not.empty);
      pm.collectionVariables.set('accessToken', body.accessToken);
      pm.collectionVariables.set('refreshToken', body.refreshToken);
    language: text/javascript
order: 28000
