$kind: http-request
description: |-
  Uses {{resetToken}} from "Forgot password - known email" (needs DEV_EXPOSE_TOKENS=true).
  New password saved, token used, every device logged out.

  Expected: 204 No Content
url: '{{baseUrl}}/api/auth/reset-password'
method: POST
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "token": "{{resetToken}}",
      "newPassword": "newSecret123"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('204 No Content', () => pm.response.to.have.status(204));
    language: text/javascript
order: 24000
