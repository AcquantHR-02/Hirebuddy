$kind: http-request
description: |-
  Bad email and a code that is not 6 digits.
  
  Expected: 400
  {"code":"VALIDATION_FAILED","message":"email: ...; otp: otp must be 6 digits",...}
url: '{{baseUrl}}/api/auth/verify-email'
method: POST
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "not-an-email",
      "otp": "12ab"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('400 Bad Request', () => pm.response.to.have.status(400));
      pm.test('code VALIDATION_FAILED', () => pm.expect(pm.response.json().code).to.eql('VALIDATION_FAILED'));
      pm.test('names email and otp', () => { const m = pm.response.json().message; pm.expect(m).to.include('email'); pm.expect(m).to.include('otp'); });
    language: text/javascript
order: 20000
