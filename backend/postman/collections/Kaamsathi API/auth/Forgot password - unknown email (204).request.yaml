$kind: http-request
description: |-
  Email that has no account. Same 204 as a real email, so nobody can find out which emails exist.

  Expected: 204 No Content
url: '{{baseUrl}}/api/auth/forgot-password'
method: POST
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "nobody-here@test.com"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('204 No Content (same as a real email)', () => pm.response.to.have.status(204));
    language: text/javascript
order: 22000
