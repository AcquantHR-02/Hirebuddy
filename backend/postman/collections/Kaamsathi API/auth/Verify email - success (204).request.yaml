$kind: http-request
description: |-
  Register page: the seeker types the 6-digit code ({{verifyToken}} from the dev header X-Dev-Verify-Token).
  After this the seeker is ACTIVE and can log in.
  
  Expected: 204 No Content
url: '{{baseUrl}}/api/auth/verify-email'
method: POST
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "{{seekerEmail}}",
      "otp": "{{verifyToken}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('204 No Content', () => pm.response.to.have.status(204));
    language: text/javascript
order: 6800
