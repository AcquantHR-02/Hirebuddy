$kind: collection
name: Kaamsathi API
description: |-
  All Kaamsathi backend endpoints. One folder per module (auth, company, job ...).
  Variables are COLLECTION variables (no environment needed).
  Start the app first (port 8080).
variables:
  - key: baseUrl
    value: 'http://localhost:8080'
    description: Where the app runs
  - key: seekerEmail
    value: ''
    description: Filled automatically by "Signup seeker - success"
  - key: verifyToken
    value: ''
    description: Filled by "Signup seeker - success" = 6-digit email OTP from the X-Dev-Verify-Token header (needs DEV_EXPOSE_TOKENS=true)
  - key: resetToken
    value: ''
    description: Filled by "Forgot password - known email" from the X-Dev-Reset-Token header (needs DEV_EXPOSE_TOKENS=true)
  - key: ownerEmail
    value: ''
    description: Filled automatically by "Signup company owner - success"
  - key: accessToken
    value: ''
    description: Filled automatically by "Login - success"; send as Authorization Bearer
  - key: refreshToken
    value: ''
    description: Filled automatically by "Login - success" / "Refresh - success"; used by refresh / logout
  - key: oldRefreshToken
    value: ''
    description: Set by "Refresh - success" before it runs; proves the old token is dead
  - key: companyOwnerEmail
    value: ''
    description: Filled by company/"Setup - signup owner" (owner used by the company folder)
  - key: ownerVerifyToken
    value: ''
    description: Filled by company/"Setup - signup owner" from X-Dev-Verify-Token (needs DEV_EXPOSE_TOKENS=true)
  - key: ownerAccessToken
    value: ''
    description: Filled by company/"Setup - login owner"; Bearer token of the COMPANY_OWNER
  - key: gstin
    value: ''
    description: Random valid GSTIN made by "Register company - success" each run
  - key: companyId
    value: ''
    description: Filled by "Register company - success"; used by admin verify / reject
  - key: recruiterEmail
    value: ''
    description: Filled by company/"Invite recruiter - success"
  - key: inviteToken
    value: ''
    description: Filled by company/"Invite recruiter - success" from X-Dev-Invite-Token (needs DEV_EXPOSE_TOKENS=true)
  - key: recruiterId
    value: ''
    description: Filled by company/"Accept invite - success"; used by the team requests
  - key: recruiterAccessToken
    value: ''
    description: Filled by company/"Login - recruiter has companyId"
  - key: recruiterRefreshToken
    value: ''
    description: Filled by company/"Login - recruiter has companyId"; proves logout after removal
  - key: skillName
    value: ''
    description: Unique skill name made by masterdata/"Skills - add (201)" each run
  - key: skillNameLower
    value: ''
    description: Lowercase copy of skillName (duplicate test)
  - key: skillId
    value: ''
    description: Filled by masterdata/"Skills - add (201)"
  - key: industryName
    value: ''
    description: Unique industry name made by masterdata/"Industries - add (201)"
  - key: industryId
    value: ''
    description: Filled by masterdata/"Industries - add (201)"
  - key: categoryName
    value: ''
    description: Unique category name made by masterdata/"Categories - add (201)"
  - key: categoryId
    value: ''
    description: Filled by masterdata/"Categories - add (201)"
  - key: cityName
    value: ''
    description: Unique city name made by masterdata/"Cities - add (201)"
  - key: cityId
    value: ''
    description: Filled by masterdata/"Cities - add (201)" (the Maharashtra one)
  - key: adminEmail
    value: ''
    description: 'Set it yourself (NOT saved here): CLI --env-var "adminEmail=..." or in the Postman app current value'
  - key: adminPassword
    value: ''
    description: 'Set it yourself (NOT saved here): CLI --env-var "adminPassword=..." or in the Postman app current value'
  - key: adminAccessToken
    value: ''
    description: Filled by company/"Setup - login admin"
  - key: jobOwnerEmail
    value: ''
    description: 'Made by job/"Setup - signup owner"'
  - key: jobOwnerVerifyToken
    value: ''
    description: 'Filled by job/"Setup - signup owner" (dev header)'
  - key: jobOwnerAccessToken
    value: ''
    description: 'Filled by job/"Setup - login owner"'
  - key: jobCompanyId
    value: ''
    description: 'Filled by job/"Setup - register company"'
  - key: jobCategoryId
    value: ''
    description: 'Filled by job/"Setup - add category"'
  - key: jobCityId
    value: ''
    description: 'Filled by job/"Setup - add city"'
  - key: jobSkillId
    value: ''
    description: 'Filled by job/"Setup - add skill"'
  - key: jobId
    value: ''
    description: 'Filled by job/"Post job - success (201)"'
  - key: newAdminEmail
    value: ''
    description: 'Made by admin/"Add admin - success (201)"'
  - key: newAdminSetupToken
    value: ''
    description: 'Set-password link token from X-Dev-Reset-Token (admin folder)'
  - key: newAdminAccessToken
    value: ''
    description: 'Filled by admin/"Login - new admin (200)"'
  - key: jobSeekerEmail
    value: ''
    description: 'Made by job/"Setup - signup seeker"'
  - key: jobSeekerOtp
    value: ''
    description: 'Email OTP from X-Dev-Verify-Token (job folder seeker)'
  - key: jobSeekerAccessToken
    value: ''
    description: 'Filled by job/"Setup - login seeker"'
  - key: liveJobId
    value: ''
    description: 'Filled by job/"Setup - find a live job"'
  - key: targetEmail
    value: ''
    description: 'Seeker managed by admin folder tests'
  - key: targetOtp
    value: ''
    description: 'Email OTP of the admin-folder target seeker'
  - key: targetId
    value: ''
    description: 'Filled by admin/"Users - search by email"'
  - key: mainAdminId
    value: ''
    description: 'Filled by admin/"Users - filter admins"'
  - key: newAdminId
    value: ''
    description: 'Filled by admin/"Users - filter admins"'
  - key: seekerCityId
    value: ''
    description: 'Filled by seeker/"Setup - add city"'
  - key: seekerSkillId
    value: ''
    description: 'Filled by seeker/"Setup - add skill"'
  - key: seekerEmail2
    value: ''
    description: 'Seeker of the seeker-profile folder (made per run)'
  - key: seekerOtp2
    value: ''
    description: 'Email OTP of seekerEmail2 (needs DEV_EXPOSE_TOKENS=true)'
  - key: seekerAccessToken2
    value: ''
    description: 'Filled by seeker/"Setup - login seeker"'
  - key: photoUserId
    value: ''
    description: 'Filled by seeker/"Photo - upload success" (user id of the seeker)'
  - key: photoFileId
    value: ''
    description: 'Filled by seeker/"Photo - upload success" (first photo file id)'
  - key: resumeFileId
    value: ''
    description: 'Filled by seeker/"Resume - upload success" (first resume file id)'
  - key: appCategoryId
    value: ''
    description: 'Filled by application/ setup or apply requests'
  - key: appCityId
    value: ''
    description: 'Filled by application/ setup or apply requests'
  - key: appSkillId
