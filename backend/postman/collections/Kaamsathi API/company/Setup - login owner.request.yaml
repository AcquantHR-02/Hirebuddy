$kind: http-request
description: |-
  Setup: logs in the owner and saves {{ownerAccessToken}}.

  Expected: 200 {"accessToken":"eyJ...", ...}
url: '{{baseUrl}}/api/auth/login'
method: POST
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "{{companyOwnerEmail}}",
      "password": "secret123"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      pm.collectionVariables.set('ownerAccessToken', pm.response.json().accessToken);
    language: text/javascript
order: 3000
