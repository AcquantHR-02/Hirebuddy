$kind: http-request
description: |-
  Only the owner manages the team; a recruiter can't remove anyone.

  Expected: 403 {"code":"ACCESS_DENIED",...}
url: '{{baseUrl}}/api/companies/me/recruiters/{{recruiterId}}'
method: DELETE
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{recruiterAccessToken}}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('403 Forbidden', () => pm.response.to.have.status(403));
      pm.test('code ACCESS_DENIED', () => pm.expect(pm.response.json().code).to.eql('ACCESS_DENIED'));
    language: text/javascript
order: 14920
