$kind: http-request
description: |-
  Id that is not a recruiter of this company (here: unknown) → 404, so outsiders learn nothing.

  Expected: 404 {"code":"USER_NOT_FOUND",...}
url: '{{baseUrl}}/api/companies/me/recruiters/00000000-0000-0000-0000-000000000000'
method: DELETE
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{ownerAccessToken}}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('404 Not Found', () => pm.response.to.have.status(404));
      pm.test('code USER_NOT_FOUND', () => pm.expect(pm.response.json().code).to.eql('USER_NOT_FOUND'));
    language: text/javascript
order: 14940
