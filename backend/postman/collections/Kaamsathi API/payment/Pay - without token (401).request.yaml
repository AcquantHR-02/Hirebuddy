$kind: http-request
description: |-
  No token → 401.

  Expected: 401 {"code":"INVALID_TOKEN", ...}
url: '{{baseUrl}}/api/payments'
method: POST
auth:
  type: noauth
body:
  type: formdata
  content:
    - key: planId
      type: text
      value: '{{planId}}'
    - key: transactionId
      type: text
      value: 'UPI-PM-123'
scripts:
  - type: afterResponse
    code: |-
      pm.test('401 Unauthorized', () => pm.response.to.have.status(401));
    language: text/javascript
order: 15000
