$kind: http-request
description: |-
  Hidden plan is not on the pricing page.

  Expected: 200 [...] without {{planId}}
url: '{{baseUrl}}/api/plans'
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      pm.test('hidden plan not listed', () => pm.expect(pm.response.json().map(p => p.id)).to.not.include(pm.collectionVariables.get('planId')));
    language: text/javascript
order: 11000
