$kind: http-request
description: |-
  No token → 401.

  Expected: 401 {"code":"INVALID_TOKEN", ...}
url: '{{baseUrl}}/api/admin/plans'
method: POST
headers:
  - key: Content-Type
    value: application/json
auth:
  type: noauth
body:
  type: json
  content: |-
    {
      "name": "NoTokenPlan",
      "priceRupees": 999,
      "durationDays": 30,
      "jobSlots": 10,
      "recruiterSeats": 3
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('401 Unauthorized', () => pm.response.to.have.status(401));
      pm.test('code INVALID_TOKEN', () => pm.expect(pm.response.json().code).to.eql('INVALID_TOKEN'));
    language: text/javascript
order: 2000
