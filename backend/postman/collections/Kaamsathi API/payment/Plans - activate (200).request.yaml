$kind: http-request
description: |-
  Show the plan again.

  Expected: 200 {"active":true, ...}
url: '{{baseUrl}}/api/admin/plans/{{planId}}/activate'
method: POST
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{adminAccessToken}}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      pm.test('active true', () => pm.expect(pm.response.json().active).to.eql(true));
    language: text/javascript
order: 13000
