$kind: http-request
description: |-
  Only GET /api/plans is public; the admin list needs a token.

  Expected: 401 {"code":"INVALID_TOKEN", ...}
url: '{{baseUrl}}/api/admin/plans'
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('401 Unauthorized', () => pm.response.to.have.status(401));
    language: text/javascript
order: 14000
