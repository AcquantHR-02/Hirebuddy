$kind: http-request
description: |-
  Max ONE pending request per company.

  Expected: 409 {"code":"PAYMENT_ALREADY_PENDING", ...}
url: '{{baseUrl}}/api/payments'
method: POST
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{appOwnerToken}}'
body:
  type: formdata
  content:
    - key: planId
      type: text
      value: '{{planId}}'
    - key: transactionId
      type: text
      value: 'UPI-PM-123'
scripts:
  - type: afterResponse
    code: |-
      pm.test('409 Conflict', () => pm.response.to.have.status(409));
      pm.test('code PAYMENT_ALREADY_PENDING', () => pm.expect(pm.response.json().code).to.eql('PAYMENT_ALREADY_PENDING'));
    language: text/javascript
order: 15600
