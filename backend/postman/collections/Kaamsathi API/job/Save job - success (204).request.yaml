$kind: http-request
description: |-
  Seeker saves a live job.
  
  Expected: 204 No Content
url: '{{baseUrl}}/api/jobs/{{liveJobId}}/save'
method: POST
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{jobSeekerAccessToken}}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('204 No Content', () => pm.response.to.have.status(204));
    language: text/javascript
order: 31600
