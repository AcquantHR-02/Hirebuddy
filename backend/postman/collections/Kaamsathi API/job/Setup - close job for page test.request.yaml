$kind: http-request
description: |-
  Setup: owner closes {{jobId}} so it disappears from the public side.
  
  Expected: 200 {"status":"CLOSED",...}
url: '{{baseUrl}}/api/jobs/{{jobId}}/close'
method: POST
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{jobOwnerAccessToken}}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
    language: text/javascript
order: 28000
