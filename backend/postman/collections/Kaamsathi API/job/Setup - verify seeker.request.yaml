$kind: http-request
description: |-
  Setup: seeker types the OTP → ACTIVE.
  
  Expected: 204
url: '{{baseUrl}}/api/auth/verify-email'
method: POST
headers:
  - key: Content-Type
    value: application/json
auth:
  type: noauth
body:
  type: json
  content: |-
    {
      "email": "{{jobSeekerEmail}}",
      "otp": "{{jobSeekerOtp}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('204 No Content', () => pm.response.to.have.status(204));
    language: text/javascript
order: 31100
