$kind: http-request
description: |-
  /api/jobs/* is public, but /api/jobs/saved is NOT (its rule comes first).
  
  Expected: 401
url: '{{baseUrl}}/api/jobs/saved'
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('401 Unauthorized', () => pm.response.to.have.status(401));
    language: text/javascript
order: 31900
