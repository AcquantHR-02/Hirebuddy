$kind: http-request
description: |-
  Setup: the company closes the job the seeker saved.
  
  Expected: 200
url: '{{baseUrl}}/api/jobs/{{liveJobId}}/close'
method: POST
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{jobOwnerAccessToken}}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
    language: text/javascript
order: 32100
