$kind: http-request
description: |-
  Remove it from the list.
  
  Expected: 204
url: '{{baseUrl}}/api/jobs/{{liveJobId}}/save'
method: DELETE
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{jobSeekerAccessToken}}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('204 No Content', () => pm.response.to.have.status(204));
    language: text/javascript
order: 32300
