$kind: http-request
description: |-
  Nothing saved any more.
  
  Expected: 200 {"items":[],"totalItems":0,...}
url: '{{baseUrl}}/api/jobs/saved'
method: GET
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{jobSeekerAccessToken}}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      pm.test('empty', () => pm.expect(pm.response.json().totalItems).to.eql(0));
    language: text/javascript
order: 32500
