$kind: http-request
description: |-
  Seeker with 1 year: fits jobs with min <= 1 <= max. Senior (4-8) and React (min 2) do not.
  
  Expected: 200, totalItems 3 (the filler jobs, min 0)
url: '{{baseUrl}}/api/jobs?categoryId={{jobCategoryId}}&experience=1'
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      pm.test('totalItems 3', () => pm.expect(pm.response.json().totalItems).to.eql(3));
    language: text/javascript
order: 25500
