$kind: http-request
description: |-
  Verified company posts job #1. Saves {{jobId}}.
  
  Expected: 201 {"id":"<uuid>","companyId":"<jobCompanyId>","status":"ACTIVE","expiresAt":"<createdAt + 60 days>",...}
url: '{{baseUrl}}/api/jobs'
method: POST
headers:
  - key: Content-Type
    value: application/json
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{jobOwnerAccessToken}}'
body:
  type: json
  content: |-
    {
      "title": "Java Backend Developer",
      "description": "Build REST APIs with Spring Boot and MySQL.",
      "categoryId": "{{jobCategoryId}}",
      "cityId": "{{jobCityId}}",
      "workMode": "HYBRID",
      "jobType": "FULL_TIME",
      "experienceMin": 1,
      "experienceMax": 4,
      "salaryMin": 400000,
      "salaryMax": 900000,
      "skillIds": [
        "{{jobSkillId}}"
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('201 Created', () => pm.response.to.have.status(201));
      const body = pm.response.json();
      pm.test('ACTIVE, my company, my skill', () => {
          pm.expect(body.status).to.eql('ACTIVE');
          pm.expect(body.companyId).to.eql(pm.collectionVariables.get('jobCompanyId'));
          pm.expect(body.skillIds).to.eql([pm.collectionVariables.get('jobSkillId')]);
      });
      pm.test('expires 60 days after creation', () => {
          const days = (new Date(body.expiresAt) - new Date(body.createdAt)) / 86400000;
          pm.expect(days).to.be.closeTo(60, 0.01);
      });
      pm.collectionVariables.set('jobId', body.id);
    language: text/javascript
order: 14000
