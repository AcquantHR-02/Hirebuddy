$kind: http-request
description: |-
  Password asked again; wrong one → nothing changes.

  Expected: 401 {"code":"INVALID_CREDENTIALS",...}
url: '{{baseUrl}}/api/companies/me/transfer-ownership'
method: POST
headers:
  - key: Content-Type
    value: application/json
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{ownerAccessToken}}'
body:
  type: json
  content: |-
    {
      "newOwnerId": "{{recruiterId}}",
      "password": "wrong-password"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('401 Unauthorized', () => pm.response.to.have.status(401));
      pm.test('code INVALID_CREDENTIALS', () => pm.expect(pm.response.json().code).to.eql('INVALID_CREDENTIALS'));
    language: text/javascript
order: 17200
