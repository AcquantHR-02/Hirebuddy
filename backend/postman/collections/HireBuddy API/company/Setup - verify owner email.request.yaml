$kind: http-request
description: |-
  Setup: verifies the owner with {{ownerVerifyToken}} → ACTIVE.

  Expected: 204 No Content
url: '{{baseUrl}}/api/auth/verify-email'
method: POST
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "token": "{{ownerVerifyToken}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('204 No Content', () => pm.response.to.have.status(204));
    language: text/javascript
order: 2000
