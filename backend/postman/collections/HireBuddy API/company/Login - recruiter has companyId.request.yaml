$kind: http-request
description: |-
  The new recruiter logs in. The access token (JWT) must carry role RECRUITER and our companyId.

  Expected: 200 {"accessToken":"eyJ...", ...}; token payload {"role":"RECRUITER","companyId":"{{companyId}}",...}
url: '{{baseUrl}}/api/auth/login'
method: POST
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "{{recruiterEmail}}",
      "password": "secret123"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      pm.collectionVariables.set('recruiterAccessToken', pm.response.json().accessToken);
      pm.collectionVariables.set('recruiterRefreshToken', pm.response.json().refreshToken);
      // JWT = header.payload.signature; payload is Base64Url JSON
      const part = pm.response.json().accessToken.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
      const claims = JSON.parse(atob(part + '='.repeat((4 - part.length % 4) % 4)));
      pm.test('token: RECRUITER of our company', () => {
          pm.expect(claims.role).to.eql('RECRUITER');
          pm.expect(claims.companyId).to.eql(pm.collectionVariables.get('companyId'));
      });
    language: text/javascript
order: 14800
