$kind: http-request
description: |-
  Made-up invite token. (Success needs an owner WITH a company → comes after Phase 2 company registration.)

  Expected: 400
  {"code":"INVALID_LINK","message":"This link is invalid or has expired",...}
url: '{{baseUrl}}/api/auth/invites/accept'
method: POST
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "token": "not-a-real-token",
      "password": "secret123",
      "consent": true
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('400 Bad Request', () => pm.response.to.have.status(400));
      pm.test('code INVALID_LINK', () => pm.expect(pm.response.json().code).to.eql('INVALID_LINK'));
    language: text/javascript
order: 31000
