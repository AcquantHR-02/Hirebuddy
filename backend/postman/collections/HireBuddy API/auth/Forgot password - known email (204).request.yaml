$kind: http-request
description: |-
  Seeker from "Signup seeker - success" asks for a reset link (logged to the app console).
  With DEV_EXPOSE_TOKENS=true the token also comes in the X-Dev-Reset-Token header → {{resetToken}}.

  Expected: 204 No Content (+ dev header)
url: '{{baseUrl}}/api/auth/forgot-password'
method: POST
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "{{seekerEmail}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('204 No Content', () => pm.response.to.have.status(204));
      const resetToken = pm.response.headers.get('X-Dev-Reset-Token');
      pm.test('dev reset token header (set DEV_EXPOSE_TOKENS=true in .env)', () => pm.expect(resetToken).to.be.a('string').and.not.empty);
      pm.collectionVariables.set('resetToken', resetToken || '');
    language: text/javascript
order: 21000
