$kind: http-request
description: |-
  Same {{resetToken}} a second time. Reset links are single-use.

  Expected: 400
  {"code":"INVALID_LINK","message":"This link is invalid or has expired",...}
url: '{{baseUrl}}/api/auth/reset-password'
method: POST
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "token": "{{resetToken}}",
      "newPassword": "otherSecret123"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('400 Bad Request', () => pm.response.to.have.status(400));
      pm.test('code INVALID_LINK', () => pm.expect(pm.response.json().code).to.eql('INVALID_LINK'));
    language: text/javascript
order: 25000
